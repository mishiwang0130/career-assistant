server:
  port: 8084

spring:
  application:
    name: career-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  agent:
    api-key: ${DASHSCOPE_API_KEY:}

logging:
  level:
    com.wxy.career: info
