server:
  port: 8084

spring:
  application:
    name: career-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 5s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  agent:
    provider: dashscope
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
    long-context-model: qwen-max
    max-iters: 12
    stream-timeout-seconds: 300
    session-ttl-hours: ${AGENT_SESSION_TTL_HOURS:168}
    # 系统提示词：每次调用 Agent 时实时读取，修改后重新加载配置即可生效。
    system-prompt: |
      你是「求职智能助手」的主助手，面向求职者提供简历、面试、职业规划相关的帮助。
      回答要求：
      1. 使用简体中文，先给结论再给理由，结构清晰；
      2. 不确定的信息必须明确说明不确定，不编造事实；
      3. 需要用户资料（例如昵称）时调用已注册的工具获取，不要凭空猜测用户信息；
      4. 涉及用户个人数据时只使用当前登录用户自己的数据。

logging:
  level:
    com.wxy.career: info
