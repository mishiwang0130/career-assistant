server:
  port: 8084

spring:
  application:
    name: career-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  agent:
    provider: dashscope
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
    long-context-model: qwen-max
    max-iters: 12
    stream-timeout-seconds: 300
    session-ttl-hours: ${AGENT_SESSION_TTL_HOURS:168}
    # 系统提示词正文放在 classpath:prompts/{agent}.md，随代码版本发布；这里只配置文件位置。
    # 多 Agent 接入后每个 Agent 一份文件，按 Agent 标识取不同位置；业务规则类内容走 Skill，不写进提示词。
    prompt-location: classpath:prompts/assistant.md
    # Skill（业务规则）存 MySQL，库名必须与数据源一致（框架默认库是 agentscope，不能直接用）。
    skill:
      database-name: career_assistant
      skills-table-name: agentscope_skills
      resources-table-name: agentscope_skill_resources

logging:
  level:
    com.wxy.career: info
