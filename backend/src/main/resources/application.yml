server:
  port: 8084

spring:
  application:
    name: career-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  agent:
    provider: dashscope
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus-2025-07-28
    long-context-model: qwen-max
    max-iters: 12
    stream-timeout-seconds: 300
    session-ttl-hours: ${AGENT_SESSION_TTL_HOURS:168}
    # 系统提示词正文放在 classpath:prompts/{agent}.md，随代码版本发布；这里只配置文件位置。
    # 多 Agent 接入后每个 Agent 一份文件，按 Agent 标识取不同位置；业务规则类内容走 Skill，不写进提示词。
    prompt-location: classpath:prompts/assistant.md
    # Skill（业务规则）存 MySQL，库名必须与数据源一致（框架默认库是 agentscope，不能直接用）。
    skill:
      database-name: career_assistant
      skills-table-name: agentscope_skills
      resources-table-name: agentscope_skill_resources
  # 模拟面试（F5）：题量与上下文压缩阈值，三份 Profile 同步补齐，非敏感配置可按环境调整。
  interview:
    question-count: 8
    compaction:
      trigger-messages: 40
      keep-messages: 16
  # 长期记忆（F6）：Mem0 服务由项目方部署与运维，这里只放连接配置；
  # 地址统一用 localhost 占位（自部署 Mem0 官方默认端口 8000），密钥只从环境变量读，部署后改环境变量即可。
  memory:
    enabled: ${MEM0_ENABLED:true}
    recall-timeout-ms: ${MEM0_RECALL_TIMEOUT_MS:3000}
    mem0:
      base-url: ${MEM0_BASE_URL:http://localhost:8000}
      api-key: ${MEM0_API_KEY:}
      api-type: ${MEM0_API_TYPE:SELF_HOSTED}
      timeout-ms: ${MEM0_TIMEOUT_MS:60000}
  # 专项辅导（F9）：读薄弱点工具单次返回的条数上限，三份 Profile 同步补齐，非敏感配置可按环境调整。
  # 本项目不启用大结果卸载，返回长度由工具自己控，因此上限是防止长列表撑上下文的主要手段。
  tutoring:
    max-weak-points: 20
  # 训练计划（F7）：计划生成边界、每日提醒 CRON/时区与 Quartz 存储参数；
  # 三份 Profile 同步补齐，全部非敏感（prod 允许用环境变量覆盖 CRON、时区与开关）。
  training:
    plan:
      # 还有几天的上限，超过按参数错误拒绝。
      max-days: 365
      # 每天可练时长的下限与上限（分钟），低于下限排不出有意义的任务。
      min-daily-minutes: 10
      max-daily-minutes: 600
      # 一份计划的任务条数上限：超出时按天压缩任务数。
      max-tasks: 200
    reminder:
      # 每天 08:00 触发一次提醒 Agent；CRON 按下面时区解释。
      cron: "${TRAINING_REMINDER_CRON:0 0 8 * * ?}"
      zone-id: ${TRAINING_REMINDER_ZONE:Asia/Shanghai}
      enabled: ${TRAINING_REMINDER_ENABLED:true}
      # 单次提醒最多处理的用户数，防止一次运行撑爆模型上下文。
      max-users-per-run: 200
    quartz:
      # Quartz 调度器实例名与线程数；单实例部署，集群开关保持 false。
      instance-name: career-assistant-quartz
      thread-count: 5
      # 框架托管表统一用 QRTZ_ 前缀，建表脚本见 sql/career_assistant.sql 的 F7 段。
      table-prefix: QRTZ_
      clustered: false
      # 测试环境可关掉自动启动，避免真起调度线程。
      auto-start: true

logging:
  level:
    com.wxy.career: info
