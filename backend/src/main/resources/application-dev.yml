# 开发测试环境：允许明文配置，数据库和 Redis 默认指向本地测试实例。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/career_assistant?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root
  data:
    redis:
      host: 192.168.205.128
      port: 6379
      database: 0
      password: 123456

app:
  jwt:
    secret: career-assistant-dev-secret-change-me
  agent:
    skill:
      database-name: career_assistant
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: career-assistant
      secure: false
  # 模拟面试（F5）：题量与上下文压缩阈值，与公共配置保持一致，测试环境可自行调整。
  interview:
    question-count: 8
    compaction:
      trigger-messages: 40
      keep-messages: 16
  # 长期记忆（F6）：测试环境同样用 localhost 占位，Mem0 部署后改环境变量即可，不改代码。
  memory:
    enabled: ${MEM0_ENABLED:true}
    recall-timeout-ms: ${MEM0_RECALL_TIMEOUT_MS:3000}
    mem0:
      base-url: ${MEM0_BASE_URL:http://localhost:8000}
      api-key: ${MEM0_API_KEY:}
      api-type: ${MEM0_API_TYPE:SELF_HOSTED}
      timeout-ms: ${MEM0_TIMEOUT_MS:60000}
  # 专项辅导（F9）：读薄弱点工具单次返回的条数上限，与公共配置保持一致，测试环境可自行调整。
  tutoring:
    max-weak-points: 20
  # 训练计划（F7）：测试环境默认值，与公共配置保持一致；验证提醒时可临时把 CRON 调到近处。
  training:
    plan:
      max-days: 365
      min-daily-minutes: 10
      max-daily-minutes: 600
    reminder:
      cron: "${TRAINING_REMINDER_CRON:0 0 8 * * ?}"
      zone-id: ${TRAINING_REMINDER_ZONE:Asia/Shanghai}
      enabled: ${TRAINING_REMINDER_ENABLED:true}
      max-users-per-run: 200
    quartz:
      instance-name: career-assistant-quartz
      thread-count: 5
      table-prefix: QRTZ_
      clustered: false
      auto-start: true

logging:
  level:
    com.wxy.career: debug
