# 生产环境：数据库、Redis、JWT 和模型密钥全部强制从环境变量读取。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  agent:
    api-key: ${DASHSCOPE_API_KEY}
    skill:
      database-name: ${MYSQL_DATABASE}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}
      secure: ${MINIO_SECURE}
  # 模拟面试（F5）：题量与上下文压缩阈值，非敏感，生产同样允许按需覆盖。
  interview:
    question-count: 8
    compaction:
      trigger-messages: 40
      keep-messages: 16
  # 长期记忆（F6）：生产环境的连接信息全部强制从环境变量读取，YAML 不留任何真实地址与密钥。
  memory:
    enabled: ${MEM0_ENABLED:true}
    recall-timeout-ms: ${MEM0_RECALL_TIMEOUT_MS:3000}
    mem0:
      base-url: ${MEM0_BASE_URL}
      api-key: ${MEM0_API_KEY}
      api-type: ${MEM0_API_TYPE:SELF_HOSTED}
      timeout-ms: ${MEM0_TIMEOUT_MS:60000}
  # 专项辅导（F9）：读薄弱点工具单次返回的条数上限，非敏感，生产同样允许按需覆盖。
  tutoring:
    max-weak-points: 20
  # 训练计划（F7）：计划边界非敏感，生产允许按需覆盖；提醒的调度参数支持用环境变量调整。
  training:
    plan:
      max-days: 365
      min-daily-minutes: 10
      max-daily-minutes: 600
    reminder:
      cron: "${TRAINING_REMINDER_CRON:0 0 8 * * ?}"
      zone-id: ${TRAINING_REMINDER_ZONE:Asia/Shanghai}
      enabled: ${TRAINING_REMINDER_ENABLED:true}
      max-users-per-run: 200
    quartz:
      instance-name: ${TRAINING_QUARTZ_INSTANCE_NAME:career-assistant-quartz}
      thread-count: 5
      table-prefix: QRTZ_
      clustered: false
      auto-start: true
