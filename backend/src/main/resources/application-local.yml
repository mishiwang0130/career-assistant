# 本地开发环境：只允许使用本地默认配置，本文件不放入真实生产密钥。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/career_assistant?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root
  data:
    redis:
      host: 192.168.205.128
      port: 6379
      database: 0
      password: 123456

app:
  jwt:
    secret: career-assistant-local-secret-change-me
  agent:
    skill:
      database-name: career_assistant
  storage:
    minio:
      secure: false
      endpoint: http://192.168.205.128:9000
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio123}
      bucket: career
  # 模拟面试（F5）：题量与上下文压缩阈值，与公共配置保持一致，本地可自行调整。
  interview:
    question-count: 8
    compaction:
      trigger-messages: 40
      keep-messages: 16
  # 长期记忆（F6）：Mem0 已部署，本地默认指向部署地址；服务不可达时主流程照常可用（降级为无长期记忆）。
  memory:
    enabled: ${MEM0_ENABLED:true}
    recall-timeout-ms: ${MEM0_RECALL_TIMEOUT_MS:3000}
    mem0:
      base-url: ${MEM0_BASE_URL:http://192.168.205.128:8765}
      api-key: ${MEM0_API_KEY:9008f059de5cb44d31f41b8a9603513acc7401e78c84a9c4}
      api-type: ${MEM0_API_TYPE:SELF_HOSTED}
      timeout-ms: ${MEM0_TIMEOUT_MS:60000}
  # 专项辅导（F9）：读薄弱点工具单次返回的条数上限，与公共配置保持一致，本地可自行调整。
  tutoring:
    max-weak-points: 20

